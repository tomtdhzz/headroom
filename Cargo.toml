[package]
name = "headroom"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Per-model, rule-aware quota headroom monitor for AI coding subscriptions (Claude / Codex via omp)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tomtdhzz/headroom"
keywords = ["claude", "codex", "quota", "rate-limit", "omp"]
categories = ["command-line-utilities"]

[[bin]]
name = "headroom"
path = "src/main.rs"

[lib]
name = "headroom"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = "z"
lto = true
strip = true
